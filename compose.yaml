services:
  server:
    build:
      context: .
      target: final
    env_file:
      - ./configs/.env
    environment:
      DB__HOST: db
      DB__PORT: "5432"
    ports:
      - 8888:8888
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6
    restart: always
    user: postgres
    volumes:
      - db-data:/var/lib/postgresql
    env_file:
      - ./configs/.env
    ports:
      - "5400:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data: