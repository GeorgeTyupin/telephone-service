openapi: 3.0.3
info:
  title: API телефонного сервиса
  version: 1.0.0
  description: |
    HTTP API телефонного сервиса для работы со звонками и абонентами.


paths:
  /calls:
    get:
      operationId: getCalls
      summary: Получить список звонков
      responses:
        '200':
          description: Список звонков
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Call'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /abonets:
    get:
      operationId: getSubscribers
      summary: Получить список абонентов
      description: Прежний URL намеренно сохранён для совместимости.
      responses:
        '200':
          description: Список абонентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /call:
    post:
      operationId: createCall
      summary: Создать звонок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCallRequest'
      responses:
        '201':
          description: Созданный звонок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'


components:
  schemas:
    Subscriber:
      type: object
      required: [id, name, phone_number]
      properties:
        id:
          type: integer
        name:
          type: string
        phone_number:
          type: string

    Call:
      type: object
      required: [id, participants, duration, created_at]
      properties:
        id:
          type: integer
        participants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Subscriber'
        duration:
          type: string
          description: Продолжительность в формате Go, например 1m30s.
        created_at:
          type: string
          description: >-
            Прежнее текстовое представление времени без ограничения RFC 3339.

    CreateCallParticipant:
      type: object
      required: [name, phone_number]
      properties:
        name:
          type: string
          minLength: 1
        phone_number:
          type: string
          minLength: 1

    CreateCallRequest:
      type: object
      required: [participants, duration, created_at]
      properties:
        participants:
          type: array
          minItems: 1
          uniqueItems: true
          description: >-
            Абоненты определяются по нормализованному телефону и не должны повторяться.
            Отсутствующие создаются, данные существующих не изменяются.
          items:
            $ref: '#/components/schemas/CreateCallParticipant'
        duration:
          type: string
          description: Продолжительность в формате Go, например 1m30s.
        created_at:
          type: string
          description: Дата и время в формате, принимаемом доменным парсером.

    Error:
      type: object
      description: Штатный формат ошибки HTTP-сервера ogen.
      required: [error_message]
      properties:
        error_message:
          type: string
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
